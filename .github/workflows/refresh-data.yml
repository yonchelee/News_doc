name: Refresh product specs from Wikipedia

# 매주 일요일 새벽 (UTC) + 수동 트리거
on:
  schedule:
    - cron: "0 18 * * 6"   # 매주 토요일 18:00 UTC = 한국 일요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export current PRODUCTS to JSON
        run: |
          node -e "
          const fs = require('fs');
          const code = fs.readFileSync('dashboard/data.js','utf8');
          fs.writeFileSync('/tmp/dc.js', code + ';module.exports = {PRODUCTS, SPECS};');
          const m = require('/tmp/dc.js');
          fs.writeFileSync('/tmp/products.json', JSON.stringify(m.PRODUCTS));
          fs.writeFileSync('/tmp/current_specs.json', JSON.stringify(m.SPECS, null, 2));
          console.log('PRODUCTS:', m.PRODUCTS.length, ' SPECS:', Object.keys(m.SPECS).length);
          "

      - name: Fetch fresh specs from Wikipedia
        run: python3 tools/fetch_specs.py /tmp/products.json /tmp/fresh_specs.json
        timeout-minutes: 15

      - name: Merge into data.js
        run: node tools/merge_specs.js /tmp/fresh_specs.json dashboard/data.js

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet dashboard/data.js; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.js
          git commit -m "chore(data): weekly refresh from Wikipedia

          Auto-generated by .github/workflows/refresh-data.yml
          Run: ${{ github.run_id }}"
          git push
