name: Refresh product data from Wikipedia (specs + images)

on:
  schedule:
    - cron: "0 18 * * 6"   # 매주 토 18:00 UTC = 한국 일요일 새벽
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export current PRODUCTS
        run: |
          node -e "
          const fs = require('fs');
          const code = fs.readFileSync('dashboard/data.js','utf8');
          fs.writeFileSync('/tmp/dc.js', code + ';module.exports = {PRODUCTS, SPECS};');
          const m = require('/tmp/dc.js');
          fs.writeFileSync('/tmp/products.json', JSON.stringify(m.PRODUCTS));
          console.log('PRODUCTS:', m.PRODUCTS.length, ' SPECS:', Object.keys(m.SPECS).length);
          "

      - name: Fetch fresh specs from Wikipedia
        run: python3 tools/fetch_specs.py /tmp/products.json /tmp/fresh_specs.json
        timeout-minutes: 15

      - name: Merge specs into data.js
        run: node tools/merge_specs.js /tmp/fresh_specs.json dashboard/data.js

      - name: Fetch fresh images from Wikipedia (metadata-filtered)
        run: python3 tools/fetch_images.py /tmp/products.json /tmp/fresh_images.json
        timeout-minutes: 10

      - name: Apply image URLs to data.js
        run: |
          node -e "
          const fs = require('fs');
          const v = require('/tmp/fresh_images.json');
          const code = fs.readFileSync('dashboard/data.js','utf8');
          fs.writeFileSync('/tmp/_dc.js', code + ';module.exports={PRODUCTS};');
          const { PRODUCTS } = require('/tmp/_dc.js');
          function slug(s){return s.toLowerCase().replace(/\\\\+/g,'-plus').replace(/\\\\(([^)]+)\\\\)/g,'-\$1').replace(/[^a-z0-9가-힣]+/g,'-').replace(/^-+|-+\$/g,'');}
          const seen={}, slugMap={};
          for(const p of PRODUCTS){let s=slug(p.model); if(seen[s]){seen[s]++;s=s+'-'+seen[s];}else seen[s]=1; slugMap[p.model]=s;}
          let updated = code;
          PRODUCTS.forEach(p => {
            const e = v[p.model];
            const url = (e && e.url && e.decision !== 'rejected') ? e.url : 'img/' + slugMap[p.model] + '.svg';
            const esc = p.model.replace(/[.*+?^\${}()|[\\\\]\\\\\\\\]/g,'\\\\\\\\\$&');
            const re = new RegExp('(\\\\\\\\{ mfr: \"[^\"]*\", category: \"[^\"]*\", model: \"' + esc + '\"[^}]*?), imageUrl: \"[^\"]*\"', 'g');
            updated = updated.replace(re, '\$1, imageUrl: \"' + url + '\"');
          });
          fs.writeFileSync('dashboard/data.js', updated);
          "

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet dashboard/data.js; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.js
          git commit -m "chore(data): weekly auto-refresh (specs + images)

          Run: ${{ github.run_id }}"
          git push
