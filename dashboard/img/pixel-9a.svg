<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Pixel 9a (Google)">
  <rect width="400" height="400" fill="#e8f0fe"/>
  <!-- 상단 가는 액센트 라인 -->
  <rect x="0" y="0" width="400" height="3" fill="#4285f4"/>
  <!-- 카테고리 아이콘 — 중앙, 큰 사이즈 -->
  <g transform="translate(100, 60) scale(1.0)" color="#0b3070">
    
    <rect x="70" y="40" width="60" height="120" rx="10" ry="10" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="92" y1="148" x2="108" y2="148" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <rect x="78" y="48" width="44" height="78" rx="2" fill="currentColor" opacity="0.06"/>
    <rect x="92" y="48" width="16" height="4" rx="2" fill="currentColor" opacity="0.4"/>
  
  </g>
  <!-- 카테고리 라벨 (작게, 상단 우측) -->
  <text x="380" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', system-ui, sans-serif"
        font-size="11" font-weight="600" fill="#4285f4" letter-spacing="0.5" text-transform="uppercase">스마트폰</text>
  <!-- 모델명 -->
  <text x="200" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', system-ui, sans-serif" font-size="19" font-weight="600" fill="#0b3070" letter-spacing="-0.3">Pixel 9a</text>
  <!-- 제조사 + 연도 -->
  <text x="200" y="336" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', system-ui, sans-serif" font-size="12" fill="#0b3070" opacity="0.6">Google · 2025</text>
</svg>